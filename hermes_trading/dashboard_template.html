<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Decision Log</title>
<style>
  /* Deliberately dark-only: a trading/monitoring terminal is conventionally
     a dark surface (Bloomberg-style), so this commits to one visual world
     rather than theming both. */
  :root {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #17171a;
    --surface-2: #1f2024;
    --ink: #f3f3f1;
    --ink-secondary: #b7b6ad;
    --ink-muted: #7c7b74;
    --hairline: #2a2a2e;
    --border: rgba(255,255,255,0.09);
    --accent: #3987e5;
    --accent-soft: rgba(57,135,229,0.14);
    --good: #1fb15a;
    --good-soft: rgba(31,177,90,0.14);
    --warning: #d99a1f;
    --warning-soft: rgba(217,154,31,0.14);
    --critical: #e2504f;
    --critical-soft: rgba(226,80,79,0.14);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ---- header ---- */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 22px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand-mark {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.04em;
  }
  .brand-tagline {
    color: var(--ink-muted);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--ink-secondary);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }
  .pill-good { background: var(--good-soft); color: var(--good); }
  .pill-warning { background: var(--warning-soft); color: var(--warning); }
  .pill-critical { background: var(--critical-soft); color: var(--critical); }
  .pill-muted { background: var(--surface-2); color: var(--ink-muted); }

  .sample-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid rgba(217,154,31,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    margin-bottom: 22px;
  }
  .sample-banner.show { display: flex; }

  /* ---- stat tiles ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--surface);
    padding: 16px 16px 14px;
  }
  .stat-label {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 21px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .stat-value.good { color: var(--good); }
  .stat-value.critical { color: var(--critical); }
  .stat-sub {
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-muted);
  }

  /* ---- layout ---- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel + .panel { margin-top: 20px; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .panel-title {
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-secondary);
    font-weight: 600;
  }
  .panel-count {
    font-size: 11px;
    color: var(--ink-muted);
  }
  .panel-body { padding: 4px 0; }
  .panel-empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 12px;
  }

  /* ---- decision log table ---- */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 8px 14px;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 14px;
    border-top: 1px solid var(--hairline);
    vertical-align: middle;
    white-space: nowrap;
  }
  tbody tr:hover { background: var(--surface-2); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .time-cell { color: var(--ink-muted); }
  .signal-chips { display: flex; gap: 5px; flex-wrap: nowrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .chip-rsi { background: var(--surface-2); color: var(--ink-secondary); }
  .chip-good { background: var(--good-soft); color: var(--good); }
  .chip-critical { background: var(--critical-soft); color: var(--critical); }
  .chip-warning { background: var(--warning-soft); color: var(--warning); }
  .chip-muted { background: var(--surface-2); color: var(--ink-muted); }
  .pnl-pos { color: var(--good); }
  .pnl-neg { color: var(--critical); }

  /* ---- reflection timeline ---- */
  .timeline { padding: 6px 16px 14px; }
  .tl-item {
    position: relative;
    padding: 10px 0 10px 18px;
    border-left: 2px solid var(--hairline);
    margin-left: 3px;
  }
  .tl-item::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 14px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--ink-muted);
  }
  .tl-item.accepted::before { border-color: var(--good); }
  .tl-item.rejected::before { border-color: var(--critical); }
  .tl-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .tl-versions { font-size: 12px; font-weight: 600; }
  .tl-hyp { font-size: 12px; color: var(--ink-secondary); line-height: 1.4; }
  .tl-scores { margin-top: 4px; font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .tl-time { font-size: 10.5px; color: var(--ink-muted); margin-top: 4px; }

  /* ---- backtest list ---- */
  .bt-list { padding: 4px 16px 14px; }
  .bt-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--hairline);
  }
  .bt-item:first-child { border-top: none; }
  .bt-main { font-size: 12px; }
  .bt-sub { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; }
  .bt-score { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }

  /* ---- live signal gates ---- */
  .gate-list { padding: 6px 16px 14px; }
  .gate-verdict {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0 12px;
    font-size: 12px;
    color: var(--ink-secondary);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 4px;
  }
  .gate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--hairline);
  }
  .gate-row:first-of-type { border-top: none; }
  .gate-name {
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .gate-detail { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .gate-mark { font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .gate-pass { color: var(--good); }
  .gate-block { color: var(--warning); }

  /* ---- strategy card ---- */
  .strategy-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
    padding: 14px 16px 16px;
  }
  .kv-label { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
  .kv-value { font-size: 14px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }

  footer {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    color: var(--ink-muted);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <span class="brand-mark">HERMES</span>
        <span class="brand-tagline">decision log — why each trade fired</span>
      </div>
      <div class="header-meta">
        <span id="asset-pill" class="pill pill-accent"><span class="pill-dot"></span><span id="asset-label"></span></span>
        <span id="version-pill" class="pill pill-muted"></span>
        <span id="generated-label"></span>
      </div>
    </div>

    <div id="sample-banner" class="sample-banner">
      <span class="pill-dot"></span>
      <span id="sample-banner-text"></span>
    </div>

    <div class="stats" id="stats"></div>

    <div class="grid">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Decision Log</span>
          <span class="panel-count" id="trades-count"></span>
        </div>
        <div class="panel-body table-scroll">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Status</th>
                <th class="num">Entry</th>
                <th class="num">Exit</th>
                <th class="num">PnL</th>
                <th>Signals</th>
              </tr>
            </thead>
            <tbody id="trades-body"></tbody>
          </table>
          <div id="trades-empty" class="panel-empty" style="display:none;">No trades yet.</div>
        </div>
      </div>

      <div>
        <div class="panel" id="live-signal-panel" style="display:none;">
          <div class="panel-head">
            <span class="panel-title">Right Now</span>
            <span class="panel-count" id="signal-age"></span>
          </div>
          <div class="gate-list" id="gate-list"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><span class="panel-title">Live Strategy</span></div>
          <div class="strategy-grid" id="strategy-grid"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Reflection History</span>
            <span class="panel-count" id="hyp-count"></span>
          </div>
          <div class="timeline" id="timeline"></div>
          <div id="hyp-empty" class="panel-empty" style="display:none;">No reflection runs yet.</div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Backtest Runs</span>
            <span class="panel-count" id="bt-count"></span>
          </div>
          <div class="bt-list" id="bt-list"></div>
          <div id="bt-empty" class="panel-empty" style="display:none;">No backtests recorded yet.</div>
        </div>
      </div>
    </div>

    <footer>
      <span>Paper trading only — no live order placement exists in this system.</span>
      <span id="footer-generated"></span>
    </footer>
  </div>

<script>
const REAL_DATA = __DASHBOARD_DATA__;

// Fallback data, used per-section below (not wholesale) so the layout is
// visible before the live loop/reflection/backtests have real entries,
// without ever masking real data that does already exist.
const SAMPLE_DATA = {
  generated_at: new Date().toISOString(),
  is_sample: true,
  strategy: { version: "02", entry: { indicator: "rsi", threshold: 28, direction: "long" }, stop_loss_pct: 2.0, take_profit_pct: 4.0, position_size_r: 0.5 },
  goal: { asset: "BTC/USDT", target_return_30d: 0.05, max_drawdown: 0.08, min_sharpe: 1.2 },
  summary: { total_trades: 6, closed_trades: 5, open_trades: 1, win_rate: 0.6, total_return: 0.034, score: 0.21, max_drawdown: 0.021, sharpe: 0.41 },
  trades: [
    { timestamp: "2026-07-28T14:02:11Z", asset: "BTC/USDT", decision: "enter_long", entry_price: 64850.12, closed: false, pnl: 0, signals: { rsi: 24.8, sentiment: "neutral", onchain_trend: "growing" } },
    { timestamp: "2026-07-27T09:41:55Z", asset: "BTC/USDT", decision: "enter_long", entry_price: 63510.40, exit_price: 66050.82, closed: true, exit_reason: "take_profit", pnl: 0.04, signals: { rsi: 26.1, sentiment: "bullish", onchain_trend: "growing" } },
    { timestamp: "2026-07-25T22:17:03Z", asset: "BTC/USDT", decision: "enter_long", entry_price: 65120.00, exit_price: 63817.60, closed: true, exit_reason: "stop_loss", pnl: -0.02, signals: { rsi: 27.4, sentiment: "neutral", onchain_trend: "stable" } },
    { timestamp: "2026-07-24T05:33:47Z", asset: "BTC/USDT", decision: "enter_long", entry_price: 62480.90, exit_price: 64980.14, closed: true, exit_reason: "take_profit", pnl: 0.04, signals: { rsi: 22.9, sentiment: "bullish", onchain_trend: "unknown" } },
    { timestamp: "2026-07-22T18:09:29Z", asset: "BTC/USDT", decision: "enter_long", entry_price: 61200.55, exit_price: 61812.56, closed: true, exit_reason: "take_profit", pnl: 0.01, signals: { rsi: 25.6, sentiment: "neutral", onchain_trend: "growing" } },
    { timestamp: "2026-07-21T11:52:14Z", asset: "BTC/USDT", decision: "enter_long", entry_price: 60340.20, exit_price: 59836.85, closed: true, exit_reason: "stop_loss", pnl: -0.008, signals: { rsi: 27.9, sentiment: "neutral", onchain_trend: "stable" } }
  ],
  hypotheses: [
    { timestamp: "2026-07-26T02:17:03Z", version_from: "01", version_to: "02", hypothesis: "Lower RSI entry threshold by 2 (from 30)", mode: "fallback", accepted: true, baseline_score: 0.11, candidate_score: 0.21 },
    { timestamp: "2026-07-19T02:17:03Z", version_from: "01", version_to: "01", hypothesis: "Tighten stop_loss_pct by 0.2 (from 2.2)", mode: "fallback", accepted: false, baseline_score: 0.14, candidate_score: 0.09 }
  ],
  backtests: [
    { timestamp: "2026-07-28T01:00:00Z", asset: "BTC/USDT", days: 30, strategy_version: "02", num_trades: 9, win_rate: 0.56, total_return: 0.038, score: 0.21 },
    { timestamp: "2026-07-14T01:00:00Z", asset: "BTC/USDT", days: 30, strategy_version: "01", num_trades: 7, win_rate: 0.43, total_return: 0.012, score: 0.11 }
  ]
};

// Strategy/goal always come from the real state files (they always exist).
// Trades/hypotheses/backtests fall back to sample independently, per
// section, so real hypotheses.jsonl entries (say) never get masked by
// sample data just because trades.jsonl happens to still be empty.
const usingSampleTrades = REAL_DATA.trades.length === 0;
const DATA = {
  generated_at: REAL_DATA.generated_at,
  strategy: REAL_DATA.strategy,
  goal: REAL_DATA.goal,
  summary: usingSampleTrades ? SAMPLE_DATA.summary : REAL_DATA.summary,
  trades: usingSampleTrades ? SAMPLE_DATA.trades : REAL_DATA.trades,
  hypotheses: REAL_DATA.hypotheses.length ? REAL_DATA.hypotheses : SAMPLE_DATA.hypotheses,
  backtests: REAL_DATA.backtests.length ? REAL_DATA.backtests : SAMPLE_DATA.backtests,
};
const usingAnySample = usingSampleTrades || REAL_DATA.hypotheses.length === 0 || REAL_DATA.backtests.length === 0;

function pct(x, digits = 1) {
  if (x === null || x === undefined) return "—";
  return (x >= 0 ? "+" : "") + (x * 100).toFixed(digits) + "%";
}
function num(x, digits = 2) {
  if (x === null || x === undefined) return "—";
  return Number(x).toFixed(digits);
}
function money(x) {
  if (x === null || x === undefined) return "—";
  return "$" + Number(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " +
         d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function sentimentChip(sentiment) {
  const cls = sentiment === "bullish" ? "chip-good" : sentiment === "bearish" ? "chip-critical" : "chip-muted";
  return `<span class="chip ${cls}">${sentiment || "n/a"}</span>`;
}
function trendChip(trend) {
  const cls = trend === "growing" ? "chip-good" : trend === "declining" ? "chip-critical" :
              trend === "unknown" ? "chip-warning" : "chip-muted";
  return `<span class="chip ${cls}">${trend || "n/a"}</span>`;
}

// ---- header ----
document.getElementById("asset-label").textContent = DATA.goal.asset || "—";
document.getElementById("version-pill").textContent = "v" + DATA.strategy.version;
document.getElementById("generated-label").textContent = "updated " + fmtTime(DATA.generated_at);
document.getElementById("footer-generated").textContent = "generated " + DATA.generated_at;
if (usingAnySample) {
  const missing = [];
  if (usingSampleTrades) missing.push("trades");
  if (!REAL_DATA.hypotheses.length) missing.push("reflection runs");
  if (!REAL_DATA.backtests.length) missing.push("backtests");
  const missingList = missing.length > 1
    ? missing.slice(0, -1).join(", ") + " or " + missing[missing.length - 1]
    : missing[0];
  document.getElementById("sample-banner-text").textContent =
    `No ${missingList} logged yet — the matching section(s) below show sample data so you can ` +
    `see the layout. Everything else on this page is real. This updates automatically as the worker runs.`;
  document.getElementById("sample-banner").classList.add("show");
}

// ---- stats ----
const s = DATA.summary;
const statsEl = document.getElementById("stats");
const statTiles = [
  { label: "Total Return", value: pct(s.total_return), cls: s.total_return > 0 ? "good" : s.total_return < 0 ? "critical" : "" },
  { label: "Win Rate", value: s.win_rate === null ? "—" : (s.win_rate * 100).toFixed(0) + "%", cls: "" },
  { label: "Score", value: s.score === null ? "—" : num(s.score, 2), cls: s.score > 0 ? "good" : s.score < 0 ? "critical" : "" },
  { label: "Max Drawdown", value: s.max_drawdown === null ? "—" : (s.max_drawdown * 100).toFixed(1) + "%", cls: "" },
  { label: "Sharpe", value: s.sharpe === null ? "—" : num(s.sharpe, 2), cls: "" },
  { label: "Open Positions", value: String(s.open_trades), cls: "" },
];
statsEl.innerHTML = statTiles.map(t => `
  <div class="stat">
    <div class="stat-label">${t.label}</div>
    <div class="stat-value ${t.cls}">${t.value}</div>
  </div>
`).join("");

// ---- decision log ----
document.getElementById("trades-count").textContent = `${DATA.trades.length} shown · ${s.closed_trades} closed`;
const tbody = document.getElementById("trades-body");
if (DATA.trades.length === 0) {
  document.getElementById("trades-empty").style.display = "block";
} else {
  tbody.innerHTML = DATA.trades.map(t => {
    const statusChip = !t.closed
      ? `<span class="chip chip-warning">OPEN</span>`
      : (t.pnl > 0 ? `<span class="chip chip-good">WIN</span>` : `<span class="chip chip-critical">LOSS</span>`);
    const sig = t.signals || {};
    return `
      <tr>
        <td class="time-cell">${fmtTime(t.timestamp)}</td>
        <td>${statusChip}</td>
        <td class="num">${money(t.entry_price)}</td>
        <td class="num">${t.exit_price ? money(t.exit_price) : "—"}</td>
        <td class="num ${t.closed ? (t.pnl > 0 ? "pnl-pos" : "pnl-neg") : ""}">${t.closed ? pct(t.pnl) : "—"}</td>
        <td>
          <div class="signal-chips">
            <span class="chip chip-rsi">RSI ${num(sig.rsi, 1)}</span>
            ${sentimentChip(sig.sentiment)}
            ${trendChip(sig.onchain_trend)}
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

// ---- live signal gates ("why isn't it trading right now?") ----
// Driven by heartbeat.json, which the trading loop rewrites every cycle --
// so this is always real, never sample, and absent only if the loop has not
// completed a cycle yet.
const hb = REAL_DATA.heartbeat || {};
if (hb.entry_gates && hb.entry_gates.length) {
  const panel = document.getElementById("live-signal-panel");
  panel.style.display = "";

  const blocked = hb.entry_blocked_by || [];
  let verdict;
  if (hb.has_open_position) {
    verdict = `<span class="chip chip-warning">HOLDING</span><span>Position open — waiting for stop-loss or take-profit before entering again.</span>`;
  } else if (blocked.length === 0) {
    verdict = `<span class="chip chip-good">READY</span><span>All entry conditions met — a trade fires on the next cycle.</span>`;
  } else {
    verdict = `<span class="chip chip-warning">WAITING</span><span>Not entering: ${blocked.length} condition${blocked.length === 1 ? "" : "s"} not met.</span>`;
  }

  document.getElementById("gate-list").innerHTML = `
    <div class="gate-verdict">${verdict}</div>
    ${hb.entry_gates.map(g => `
      <div class="gate-row">
        <div>
          <div class="gate-name">${g.name.replace(/_/g, " ")}</div>
          <div class="gate-detail">${g.detail}</div>
        </div>
        <span class="gate-mark ${g.passing ? "gate-pass" : "gate-block"}">${g.passing ? "✓" : "✕"}</span>
      </div>
    `).join("")}
  `;

  if (hb.timestamp) {
    const ageMin = Math.round((Date.now() - new Date(hb.timestamp).getTime()) / 60000);
    document.getElementById("signal-age").textContent =
      ageMin <= 1 ? "just now" : `${ageMin} min ago`;
  }
}

// ---- strategy card ----
const st = DATA.strategy;
document.getElementById("strategy-grid").innerHTML = `
  <div><div class="kv-label">Entry Rule</div><div class="kv-value">RSI &lt; ${st.entry.threshold}</div></div>
  <div><div class="kv-label">Direction</div><div class="kv-value">${st.entry.direction}</div></div>
  <div><div class="kv-label">Stop Loss</div><div class="kv-value">${st.stop_loss_pct}%</div></div>
  <div><div class="kv-label">Take Profit</div><div class="kv-value">${st.take_profit_pct}%</div></div>
`;

// ---- reflection history ----
document.getElementById("hyp-count").textContent = `${DATA.hypotheses.length} run${DATA.hypotheses.length === 1 ? "" : "s"}`;
const tl = document.getElementById("timeline");
if (DATA.hypotheses.length === 0) {
  document.getElementById("hyp-empty").style.display = "block";
} else {
  tl.innerHTML = DATA.hypotheses.map(h => {
    // Records from before validated reflection was added have no "accepted"
    // field at all -- infer it from whether the version actually changed,
    // since the old code applied every proposed change unconditionally.
    const accepted = h.accepted !== undefined ? h.accepted === true : h.version_from !== h.version_to;
    const versions = h.version_from === h.version_to
      ? `v${h.version_from} unchanged`
      : `v${h.version_from} → v${h.version_to}`;
    const scoreLine = (h.baseline_score !== undefined && h.baseline_score !== null)
      ? `score ${num(h.baseline_score)} → ${num(h.candidate_score)}`
      : (h.reason ? h.reason.replace(/_/g, " ") : "");
    return `
      <div class="tl-item ${accepted ? "accepted" : "rejected"}">
        <div class="tl-head">
          <span class="tl-versions">${versions}</span>
          <span class="pill ${accepted ? "pill-good" : "pill-muted"}">${accepted ? "accepted" : "rejected"}</span>
        </div>
        <div class="tl-hyp">${h.hypothesis}</div>
        ${scoreLine ? `<div class="tl-scores">${scoreLine}</div>` : ""}
        <div class="tl-time">${fmtTime(h.timestamp)}</div>
      </div>
    `;
  }).join("");
}

// ---- backtest runs ----
document.getElementById("bt-count").textContent = `${DATA.backtests.length} run${DATA.backtests.length === 1 ? "" : "s"}`;
const btList = document.getElementById("bt-list");
if (DATA.backtests.length === 0) {
  document.getElementById("bt-empty").style.display = "block";
} else {
  btList.innerHTML = DATA.backtests.map(b => `
    <div class="bt-item">
      <div>
        <div class="bt-main">v${b.strategy_version} · ${b.days}d · ${b.num_trades} trades</div>
        <div class="bt-sub">${fmtTime(b.timestamp)} · win rate ${b.win_rate === null ? "—" : (b.win_rate * 100).toFixed(0) + "%"}</div>
      </div>
      <div class="bt-score ${b.score > 0 ? "pnl-pos" : b.score < 0 ? "pnl-neg" : ""}">${num(b.score, 2)}</div>
    </div>
  `).join("");
}
</script>
</body>
</html>
